<!doctype html><html lang="en-AU"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MechTrek — Set a new password</title>
<style>
:root{--bg:#ffffff;--ink:#1b1e22;--muted:#5f656c;--line:#d5dae0;--amber:#ffb020;--red:#cf2f2f;--field:#f4f5f7}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--ink:#eceef0;--muted:#a2a8ae;--line:#2a323b;--field:#1d232a;--red:#ff6b6b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:440px;margin:0 auto;padding:56px 20px}img{width:72px;height:72px;border-radius:18px}
h1{font-size:26px;margin:16px 0 6px}p{color:var(--muted);margin:6px 0}
label{display:block;font-size:14px;color:var(--muted);margin:16px 0 6px}
input{width:100%;font:inherit;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--field);color:var(--ink)}
button{width:100%;margin-top:20px;padding:16px;border:0;border-radius:18px;background:var(--amber);color:#1a1300;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}.err{color:var(--red);margin-top:12px}.hide{display:none}
</style></head><body><main>
<img src="icon.png" alt="MechTrek icon">
<div id="loading"><h1>One moment…</h1><p>Checking your reset link.</p></div>

<form id="form" class="hide" novalidate>
  <h1>Set a new password</h1>
  <p>For your MechTrek account <b id="who"></b></p>
  <label for="pw">New password (8+ characters)</label>
  <input id="pw" type="password" autocomplete="new-password" required minlength="8">
  <label for="pw2">Confirm new password</label>
  <input id="pw2" type="password" autocomplete="new-password" required minlength="8">
  <div id="err" class="err" role="alert"></div>
  <button id="save" type="submit">Save new password</button>
</form>

<div id="done" class="hide"><h1>Password updated</h1><p>Go back to the MechTrek app and sign in with your new password.</p></div>
<div id="bad" class="hide"><h1>That link didn't work</h1><p id="badmsg">It may have expired or already been used. In MechTrek, tap “Forgot password?” to get a new one.</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  var SUPABASE_URL = 'https://mrnrnlhdjdanchzwafwl.supabase.co';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ybnJubGhkamRhbmNoendhZndsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIwNzg0MDQsImV4cCI6MjA4NzY1NDQwNH0.0xgX3kvU57uLHbvXzRfnXT0aF4JKqRLxLWIUTpAU-0M';
  function show(id) { ['loading', 'form', 'done', 'bad'].forEach(function (x) { document.getElementById(x).classList.toggle('hide', x !== id); }); }

  var hash = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  if (hash.get('error_description')) {
    document.getElementById('badmsg').textContent = hash.get('error_description').replace(/\+/g, ' ') + '. In MechTrek, tap “Forgot password?” to get a new link.';
    show('bad');
  } else {
    var sb = supabase.createClient(SUPABASE_URL, ANON, { auth: { detectSessionInUrl: true, persistSession: false, flowType: 'implicit' } });
    var ready = false;
    function ok(session) {
      if (ready || !session) return;
      ready = true;
      document.getElementById('who').textContent = session.user && session.user.email ? '(' + session.user.email + ')' : '';
      if (location.hash) history.replaceState(null, '', location.pathname);
      show('form');
    }
    sb.auth.onAuthStateChange(function (event, session) { if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') ok(session); });
    sb.auth.getSession().then(function (r) { ok(r.data.session); });
    setTimeout(function () { if (!ready) show('bad'); }, 6000);

    document.getElementById('form').addEventListener('submit', function (e) {
      e.preventDefault();
      var pw = document.getElementById('pw').value, pw2 = document.getElementById('pw2').value, err = document.getElementById('err');
      err.textContent = '';
      if (pw.length < 8) { err.textContent = 'Password must be at least 8 characters.'; return; }
      if (pw !== pw2) { err.textContent = 'The passwords don’t match.'; return; }
      var btn = document.getElementById('save'); btn.disabled = true; btn.textContent = 'Saving…';
      sb.auth.updateUser({ password: pw }).then(function (r) {
        if (r.error) { err.textContent = r.error.message; btn.disabled = false; btn.textContent = 'Save new password'; return; }
        sb.auth.signOut();
        show('done');
      });
    });
  }
</script>
</main></body></html>
